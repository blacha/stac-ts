version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: daily
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: daily
    commit-message:
      prefix: 'feat'
      prefix-development: 'build'
      include: 'scope'
    open-pull-requests-limit: 10
    groups:
      dev-tooling:
        patterns:
          - 'oxlint'
          - 'oxlint-*'
          - 'oxfmt'
          - 'typescript'
